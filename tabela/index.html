<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="icon" href="steamhappy.png" type="image/x-icon">
</head>
<body>
    <table border="1">
        <caption>
            Aaaaaaaaaaa
        </caption>
        <thead>
            <tr>
                <th>A</th> <th>b</th> <th>c</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">A1</td> <td>A2</td> <td>A3</td>
            </tr>

            <tr>
                <td>A2</td> <td>b2</td> <td>c2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
